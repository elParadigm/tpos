<!doctype html>
<html lang="fr" data-theme="corporate">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="text-scale" content="scale" />
	<link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontSize: {
						sm: ['0.9rem', {lineHeight: '1.5rem'}],
						base: ['1.1rem', {lineHeight: '1.7rem'}],
						lg: ['1.25rem', {lineHeight: '1.8rem'}],
						xl: ['1.4rem', {lineHeight: '1.9rem'}],
					}
				}
			}
		}
	</script>
	<style>
		html {
			font-size: 17px;
		}

		body {
			font-size: 1rem;
		}

		.table {
			font-size: 0.95rem;
		}

		.btn {
			font-size: 0.95rem;
		}

		.input,
		.select,
		.textarea {
			font-size: 0.95rem;
		}

		.badge {
			font-size: 0.85rem;
		}

		.stat-value {
			font-size: 2rem;
		}

		.card-title {
			font-size: 1.15rem;
		}

	</style>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
