<!doctype html>
<html lang="fr" data-theme="corporate">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="text-scale" content="scale" />
	<link href="/app.css" rel="stylesheet" />
	<script src="/chart.umd.min.js"></script>
	<style>
		/* Self-hosted Inter (variable, 400-800) — matches the former Google
		   Fonts `wght@400..800` exactly, including the 900 -> 800 clamp. */
		@font-face {
			font-family: 'Inter';
			font-style: normal;
			font-display: swap;
			font-weight: 400 800;
			src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
			unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
		}
		@font-face {
			font-family: 'Inter';
			font-style: normal;
			font-display: swap;
			font-weight: 400 800;
			src: url('/fonts/inter-latin-ext-wght-normal.woff2') format('woff2-variations');
			unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
		}
	</style>
	<style>
		html { font-size: 18px; }
		html, body, .btn, .input, .select, .textarea, .badge, .card, .card-body, .card-title,
.navbar, .menu, .drawer, .modal-box, .table, .table th, .table td, .stat, .stat-value,
.stat-title, .stat-desc, .label, .tab, .tabs, .alert, .badge, .btn-primary, .btn-ghost,
.btn-outline, .btn-error, .btn-success, .btn-info, .btn-warning, button, input, select,
textarea, th, td, .menu-title, .menu li a, .menu li button, .drawer-side, .modal,
.modal-backdrop, .form-control, .join, .join-item, .kiosk-bar,
div, span, p, h1, h2, h3, h4, h5, h6, a, strong, small, label, li, ul, ol, section,
main, aside, header, footer, nav, article, .no-print, .only-print, .font-bold, .font-medium,
.font-semibold, .font-extrabold, .font-black, .font-mono, .uppercase, .capitalize, .tracking-wide {
	font-family: "Inter", system-ui, sans-serif !important;
}

		.btn { font-size: 0.95rem; padding: 0.5rem 1rem; min-height: 2.5rem; }
		.btn-xs { font-size: 0.8rem; padding: 0.2rem 0.6rem; min-height: 1.8rem; }
		.btn-sm { font-size: 0.85rem; padding: 0.35rem 0.8rem; min-height: 2.1rem; }
		.btn-lg { font-size: 1.05rem; padding: 0.6rem 1.2rem; min-height: 3rem; }

		.input, .select, .textarea { font-size: 0.95rem; padding: 0.5rem 0.75rem; min-height: 2.5rem; }
		.input-sm, .select-sm { font-size: 0.85rem; min-height: 2.1rem; }
		.input-xs { font-size: 0.8rem; min-height: 1.8rem; }

		.table { font-size: 0.95rem; }
		.table th { font-size: 0.85rem; letter-spacing: 0.03em; padding: 0.7rem 0.75rem !important; }
		.table td { padding: 0.65rem 0.75rem !important; }

		.badge { font-size: 0.8rem; padding: 0.2rem 0.6rem; min-height: 1.5rem; }
		.badge-sm { font-size: 0.7rem; }

		.stat-value { font-size: 2rem; }
		.card-title { font-size: 1.15rem; }
		.stat-title { font-size: 0.85rem; }
		.stat-desc { font-size: 0.8rem; }

		.label { font-size: 0.9rem; }
		.menu-title { font-size: 0.8rem; }

		/* The store/business name in the sidebar — sized as a brand header,
		   not a section label. */
		.store-title {
			font-size: 1.75rem !important;
			font-weight: 800 !important;
			line-height: 1.1;
		}

		.tab { font-size: 0.9rem; }

		th, label, .label, .stat-title, .menu-title { font-weight: 600; }

		.table thead tr th {
			background-color: #1e40af !important;
			color: #ffffff !important;
			font-size: 0.95rem !important;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}

		/* Print: hide all app chrome (top bar, shutdown/power menu,
		   sidebar, mobile navbar) and keep only the printable receipt */
		@media print {
			.no-print,
			.navbar,
			.drawer-side,
			.kiosk-bar {
				display: none !important;
			}
			main {
				background: #ffffff !important;
				min-height: 0 !important;
			}
		}
	</style>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
